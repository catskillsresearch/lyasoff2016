fidelity:
  divergences: >-
    Working source: sources/lyasoff2016.pdf; vision OCR
    sources/lyasoff2016_vision.md is the preferred formula transcription.
    Lean proof path for Yor/π often matches densities by Laplace and transfers
    from Yor to the π-family, rather than specializing a prior π-density as in
    the paper’s Rem 5.1 narrative order; conclusions agree. Table enclosures
    use classical numerical certificates, not interval re-derivation.
    Exact narrative alignment lives in Actions.md / Actions.pdf.


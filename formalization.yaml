automation:
  methods:
  - method: agent
    models:
    - Cursor Grok 4.7
    - Cursor Composer
    - Claude Fable
    - Google Gemini
    framework: Cursor
    role: >-
      Primary agents for Lean 4 / Mathlib formalization, lake build repair,
      vision-OCR alignment, Actions writeup, and Palomar packaging.
  - method: manual
    models: []
    role: >-
      Lars Warren Ericson chose the formalization route and reviewed the
      Lean development. The human author takes responsibility for the
      report's mathematical claims.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml packaging
    follows the scott_models / nowakowska1982 template. No other human
    collaborators. Andrew Lyasoff had no involvement.

review:
  status: self-assessed
  reviewers:
  - Lars Warren Ericson
  notes: >-
    Lars Warren Ericson directed and reviewed the Lean development. This is
    not recorded as an independent external review. Every Comparator proof
    step is checked by the Lean kernel. Chart axiom audit:
    scripts/validate_chart_axioms.sh.

known_gaps:
  - >-
    No Lean `axiom` declarations. Classical/numerical gaps are `sorry`
    theorems on the holes board.
  - >-
    asian_delta and hasDerivAt_integral_Re_Ffun are proved without global
    `(u,w)` domination, using the call derivative and the Girsanov-tilted
    order-4 joint density.
  - >-
    table1–table4_asian_enclosure depend on open numerical holes
    table*_asian_enclosure_classical (paper mpmath/spline quadratures), not
    interval-arithmetic re-derivations. They claim the printed digits only to
    the absolute tolerance tableClaimTol = 1e-9 (independent check
    scripts/asian_tables_independent_check.py: worst miss 2.2e-10); the
    paper's per-table K = 0 error figures (1e-15 to 1e-11) are not claimed.
  - >-
    Those four proof-chart entries are outside comparator.json because
    Palomar permits only propext, Quot.sound, and Classical.choice.
  - >-
    Selected §4 Comparator theorems theorem_4_1_pde, theorem_4_1_striking,
    formula_4_6, and theorem_4_5 are conditional implications. Open holes
    cond_density_satisfies_* ask for those inputs on a genuine conditional
    density; the rearrangements alone are not unconditional density IDs.

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Source PDF and OCR transcriptions are not Apache-2.0; see NOTICE.


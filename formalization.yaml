# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# lyasoff2016 — Palomar packaging (Challenge/Solution/comparator).
version: v0.4
project:
  name: Lyasoff 2016 Asian options and exp-BM integral in Lean 4
  description: >-
    A Lean 4 / Mathlib formalization of Andrew Lyasoff, "Another look at
    the integral of exponential Brownian motion and the pricing of Asian
    options", Finance Stoch. 20 (2016) 1061–1096. Framing: rigorous
    reconstruction/verification of the paper’s joint-density, Fokker–Planck,
    foliation, π/π/2 contour, Yor (1.1)/Rem 5.1, and Asian pricing material.
    The Comparator family is the 34 proof-chart theorems whose proofs use
    only propext, Quot.sound, and Classical.choice (including time_reversal,
    Prop 2.2, Dufresne, joint Fokker–Planck, the §4 conditional rearrangements
    theorem_4_1_pde / theorem_4_1_striking / formula_4_6 / theorem_4_5,
    g_solves_contour_equation, yor_formula, pi_formula, S_closed_form,
    asian_price_formula, asian_delta), together with compared
    density/integrand definitions. Four chart certificates (Tables 1–4
    enclosures) remain open numerical `sorry` holes outside Comparator.
    `SfunC.hasDerivAt` and `hasDerivAt_integral_Re_Ffun` are proved; the latter
    uses the tilted-density/Girsanov route rather than global `(u,w)` domination.
    Project rule: no Lean `axiom` declarations.
    The selected §4 theorems are conditional implications (they assume the
    foliation PDE / striking / ODE / Laplace inputs rather than constructing
    them for the conditional density). Andrew Lyasoff did not participate in
    or endorse this formalization. Lean was written with AI-agent assistance
    under Lars Warren Ericson’s direction and review. There is no sorry in the
    compared Lyasoff2016 development for the Comparator family, and Mathlib
    plus pinned public Git dependencies supply the analytic/probabilistic stack.
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
repository:
  role: substantive-development
classification:
  arxiv:
  - math.PR
